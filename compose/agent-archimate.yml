services:
  agent-archimate:
    image: archagent/agent-archimate:${VERSION:-dev}
    build:
      context: ..
      dockerfile: src/archagent/agents/archimate/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL_TEXT: ${LLM_MODEL_TEXT:-qwen3.8-max}
      LLM_MODEL_VISION: ${LLM_MODEL_VISION:-qwen3.8-max}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_MAX_TOKENS_PER_SESSION: ${LLM_MAX_TOKENS_PER_SESSION:-400000}
      LLM_MODE: ${LLM_MODE:-dashscope}
      TOOL_ARCHI_URL: http://tool-archi:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Enquanto as fichas não forem revisadas, os rascunhos ficam em uso (pendência P-12).
      VAULT_INCLUIR_RASCUNHOS: ${VAULT_INCLUIR_RASCUNHOS:-true}
    volumes:
      - sessions:/data/sessions
      - propostas:/app/kb/archimate/propostas
    # Sem portas publicadas: só a ui fala com o agente, pela rede interna.
    restart: unless-stopped

volumes:
  sessions:
  propostas:
