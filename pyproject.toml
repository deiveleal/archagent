[project]
name = "archagent"
version = "0.1.0"
description = "Agente de análise e orientação de arquitetura (Etapa 1: MVP ArchiMate)"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Deive Leal" }]
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "lxml>=6.1",
    "python-docx>=1.2",
    "pillow>=13.0",
]

[project.scripts]
archagent-mcp = "archagent.mcp.server:main"

[project.optional-dependencies]
# Imagem do agente ArchiMate: API, grafo e cliente LLM.
agent = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "python-multipart>=0.0.33",
    "langgraph>=1.2",
    "openai>=3.46",
]
# Imagem da interface.
ui = ["streamlit>=1.67"]
# Imagem do tool-archi: só a API mínima.
tool = ["fastapi>=0.162", "uvicorn>=0.54", "python-multipart>=0.0.33"]
# Imagem do servidor MCP (expõe a API do agente a clientes como o Claude Code).
mcp = ["mcp>=2.3"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-pyyaml>=6.0",
    "respx>=0.23",
    "lxml-stubs>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archagent"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts", "evals", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "RUF001", # aceita caracteres do português em strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"evals/**" = ["S101"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["archagent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docx.*", "streamlit.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: testes N2 que precisam de serviços (ex.: tool-archi real)",
]

[tool.coverage.run]
source = ["src/archagent"]
omit = ["src/archagent/ui/*"]
